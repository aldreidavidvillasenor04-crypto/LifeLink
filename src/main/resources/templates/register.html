<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | LifeLink</title><link rel="stylesheet" th:href="@{/css/register.css(v=4)}"><script defer th:src="@{/js/register.js(v=4)}"></script><script defer th:src="@{/js/password-visibility.js(v=1)}"></script></head><body>
<header class="navbar"><a class="logo-section" href="/"><span class="logo-heart">♥</span><span><b class="logo-text">LifeLink</b><small class="logo-subtitle">Blood Donation Management System</small></span></a><nav class="nav-links"><a href="/">Home</a><a href="/about">About</a><a href="/features">Features</a><a href="/contact">Contact</a></nav><a href="/login" class="login-link">Log in</a></header>
<main class="page-container"><div class="auth-card"><section class="welcome-panel"><h1>Join LifeLink</h1><p>Together, we can save more lives.</p><div class="blood-bag"><div class="bag-body">♥</div></div></section><section class="register-panel"><h2>Create account</h2><p class="subtitle">Create your donor or authorized admin account.</p><div th:if="${error}" class="error-message" th:text="${error}" role="alert"></div><form th:action="@{/register}" method="post" id="registerForm">
<div class="form-grid"><label>First name<input name="firstName" autocomplete="given-name" required maxlength="80" th:value="${param.firstName}"></label><label>Last name<input name="lastName" autocomplete="family-name" required maxlength="80" th:value="${param.lastName}"></label></div>
<label for="username">Username</label><div class="input-container"><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="60" th:value="${param.username}" placeholder="Choose a username"></div>
 <label for="accountType">Account type</label><select id="accountType" name="accountType" required><option value="DONOR" selected>Blood donor</option><option th:if="${adminRegistrationEnabled}" value="ADMIN">Administrator</option></select>
<div id="adminCodeWrap" hidden><label for="adminCode">Admin validation code</label><input id="adminCode" name="adminCode" type="password" autocomplete="off" placeholder="Enter the code provided by your organization"><small>Only authorized administrators should use this option.</small></div>
<div id="donorFields"><div class="form-grid">
<label>Email address<input name="email" type="email" autocomplete="email" required maxlength="100" th:value="${param.email}" placeholder="you@example.com"></label>
<label>Phone number<input name="phone" type="tel" autocomplete="tel" required maxlength="30" th:value="${param.phone}" placeholder="+63 900 000 0000"></label>
<label>Age<input name="age" type="number" min="1" max="120" inputmode="numeric" required th:value="${param.age}"></label>
<label>Blood type<select name="bloodType" required><option value="">Select blood type</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label>
<label>Gender<select name="gender" required><option value="">Select</option><option>Female</option><option>Male</option></select></label>
</div><label for="address">Address</label><textarea id="address" name="address" autocomplete="street-address" required maxlength="255" rows="2" th:text="${param.address}"></textarea>
</div>
<div class="form-grid"><label>Password<input id="registerPassword" name="password" type="password" autocomplete="new-password" required minlength="8"><button class="password-toggle" type="button" data-password-toggle="registerPassword" aria-label="Show password" aria-pressed="false">Show</button></label><label>Confirm password<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8"><button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show confirm password" aria-pressed="false">Show</button></label></div>
<button type="submit" class="register-submit">Create account</button></form><p class="login-link">Already registered? <a href="/login"><strong>Continue to log in</strong></a></p></section></div></main></body></html>
