<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donations | LifeLink</title><link rel="stylesheet" th:href="@{/css/dashboard.css(v=2)}"><script defer th:src="@{/js/dashboard.js(v=2)}"></script></head><body class="dashboard-page"><div class="app-shell"><button class="mobile-menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="dashboard-main"><div th:replace="~{fragments/topbar :: topbar}"></div><header class="admin-heading"><p class="eyebrow">ADMIN MODULE</p><h1>Donation & Appointment Management</h1><p>Record donations, manage appointments, and update completed donation stock.</p></header>
<section class="panel module-panel"><h2>Record donation</h2><form method="post" th:action="@{/admin/donations}" class="inline-form"><label>Donor<select name="donorId" required><option value="">Choose donor</option><option th:each="d : ${donors}" th:value="${d.id}" th:text="${d.fullName + ' (' + d.bloodType + ')'}"></option></select></label><label>Date<input type="date" name="donationDate" required></label><label>Bags collected<input type="number" name="bags" min="1" required></label><button class="primary-button">Save donation</button></form><div class="table-wrap"><table><thead><tr><th>Date</th><th>Donor</th><th>Blood type</th><th>Bags</th><th>Status</th><th>Update</th></tr></thead><tbody><tr th:each="d : ${donations}"><td th:text="${d.donationDate}"></td><td th:text="${d.donor.fullName}"></td><td th:text="${d.bloodType}"></td><td th:text="${d.bags}"></td><td th:text="${d.status}"></td><td><form method="post" th:action="@{'/admin/donations/' + ${d.id} + '/status'}"><select name="status"><option th:value="${d.status}" th:text="${d.status}"></option><option>PENDING</option><option>COMPLETED</option><option>CANCELLED</option></select><button>Update</button></form></td></tr><tr th:if="${#lists.isEmpty(donations)}"><td colspan="6">No donation records yet.</td></tr></tbody></table></div></section>
<section class="panel module-panel"><h2>Appointments</h2><div class="table-wrap"><table><thead><tr><th>Donor</th><th>Date and time</th><th>Hospital</th><th>Status</th><th>Admin action</th></tr></thead><tbody><tr th:each="a : ${appointments}"><td th:text="${a.donor.fullName}"></td><td th:text="${a.appointmentAt}"></td><td th:text="${a.hospitalName}"></td><td th:text="${a.status}"></td><td><form method="post" th:action="@{'/admin/appointments/' + ${a.id} + '/status'}"><select name="status"><option>PENDING</option><option>APPROVED</option><option>DENIED</option><option>CANCELLED</option></select><button>Update</button></form><form method="post" th:action="@{'/admin/appointments/' + ${a.id} + '/reschedule'}"><input type="datetime-local" name="appointmentAt" required><button>Reschedule</button></form></td></tr><tr th:if="${#lists.isEmpty(appointments)}"><td colspan="5">No appointment records yet.</td></tr></tbody></table></div></section></main></div></body></html>
